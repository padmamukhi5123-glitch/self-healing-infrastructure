groups:
  - name: infrastructure-alerts
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Node exporter is down"
          description: "Prometheus cannot collect host metrics."

      - alert: HighCPUUsage
        expr: |
          100 * (1 - avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[2m])
          )) > 90
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is above 90%"
          description: "Host CPU usage has remained above 90% for one minute."
      - alert: ServiceDown
        expr: self_healing_service_up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Web service is down"
          description: "The web service health check failed."
